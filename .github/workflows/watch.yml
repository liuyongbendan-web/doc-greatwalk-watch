name: DOC Great Walk availability watch

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs by 5-20 min at peak.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: gw-watch
  cancel-in-progress: false

permissions:
  contents: write   # commit status.json back so the phone page can show it

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache watch_state.json so the same vacancy is not pushed every 15 min.
      - name: Restore previous state
        uses: actions/cache@v4
        with:
          path: watch_state.json
          key: gw-state-${{ github.run_id }}
          restore-keys: gw-state-

      # Tracks, dates and party size come from watchlist.json in this repo.
      # Edit them with the local UI (doc-booking/ui_server.py); it commits here on save.
      - name: Check availability
        env:
          GW_WEBHOOK_URL: ${{ secrets.GW_WEBHOOK_URL }}
        run: |
          if [ -z "$GW_WEBHOOK_URL" ]; then
            echo "::error::Repository secret GW_WEBHOOK_URL is not set."
            echo "::error::Without it a vacancy can be found but never reach your phone."
            echo "::error::Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python3 watch.py --once

      # Publish status.json for the phone page. Commit only when something changed,
      # or when the last published status is older than 60 minutes.
      - name: Publish status
        if: always()
        run: |
          [ -f status.json ] || exit 0
          if python3 - <<'PY'
          import json, subprocess, sys
          from datetime import datetime
          new = json.load(open("status.json"))
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD:status.json"],
                                              capture_output=True, text=True, check=True).stdout)
          except Exception:
              sys.exit(1)                      # nothing published yet: publish
          strip = lambda d: {k: v for k, v in d.items() if k != "generated_at"}
          age = (datetime.fromisoformat(new["generated_at"]) - datetime.fromisoformat(old["generated_at"])).total_seconds() / 60
          sys.exit(0 if strip(new) == strip(old) and age < 60 else 1)   # 0 = unchanged and fresh: skip
          PY
          then
            echo "status unchanged, nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          for i in 1 2 3; do
            git commit -q -m "Update status" || exit 0
            git pull -q --rebase origin main && git push -q origin main && exit 0
            sleep 3
          done
          exit 1
